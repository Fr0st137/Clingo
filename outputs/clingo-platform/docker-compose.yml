services:
  postgres:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_DB: clingo
      POSTGRES_USER: clingo
      POSTGRES_PASSWORD: clingo
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres-data-v2:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data

volumes:
  postgres-data-v2:
  redis-data:
